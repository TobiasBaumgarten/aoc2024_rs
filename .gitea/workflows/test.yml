name: test and clippy
run-name: test and clippy
on: [push]

jobs:
  test-repro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo test --verbose
      - run: cargo clippy -- -D warnings
